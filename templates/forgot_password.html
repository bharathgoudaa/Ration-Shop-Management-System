{% extends "base.html" %}
{% block content %}
<div class="login-bg">
    <div class="form-container">
        <h2>Reset Password</h2>
        <p>Enter your username and registered phone number.</p>
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username (e.g. owner)" required>
            <input type="text" name="phone" placeholder="Registered Phone Number" required>
            <button class="btn btn-primary" type="submit" style="margin-top: 10px;">Send OTP</button>
        </form>
        
        <div style="margin-top: 15px;">
            <a href="{{ url_for('login') }}" style="font-size: 13px;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
