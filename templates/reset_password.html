{% extends "base.html" %}
{% block content %}
<div class="login-bg">
    <div class="form-container">
        <h2>Enter OTP</h2>
        <p>We sent a code to your phone (Check the green banner!).</p>
        
        <form method="POST">
            <input type="text" name="otp" placeholder="6-digit OTP" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <button class="btn btn-primary" type="submit" style="margin-top: 10px;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
