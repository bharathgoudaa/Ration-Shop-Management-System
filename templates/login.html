{% extends "base.html" %}
{% block content %}
<div class="login-bg">
    <div class="form-container">
        <h2>Ration Shop Portal</h2>
        <p>Select your role and log in to continue.</p>
        
        <form method="POST">
            <select name="role" required>
                <option value="" disabled selected>-- Select Login Role --</option>
                <option value="owner">Shop Owner</option>
                <option value="employee">Shop Employee</option>
            </select>

            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <button class="btn btn-primary" type="submit" style="margin-top: 10px;">Login</button>
        </form>

        <div style="margin-top: 15px; display: flex; justify-content: space-between; font-size: 13px;">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            <a href="{{ url_for('register') }}">Register here</a>
        </div>
        
        <div style="font-size: 12px; margin-top: 20px; color: #ddd;">
            <strong>Demo Login:</strong> owner / owner123
        </div>
    </div>
</div>
{% endblock %}
